<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="980" fill="#FFFFFF"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5B6678"/></marker></defs>
<line x1="155" y1="170" x2="155" y2="190" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="155" y1="250" x2="155" y2="270" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="155" y1="340" x2="155" y2="360" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="155" y1="420" x2="155" y2="440" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="270" y1="208" x2="330" y2="202" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="270" y1="247" x2="330" y2="261" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="208" y1="250" x2="384" y2="350" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="270" y1="482" x2="330" y2="488" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="563" y1="230" x2="640" y2="259" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="580" y1="296" x2="640" y2="299" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="580" y1="356" x2="640" y2="339" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="534" y1="450" x2="678" y2="360" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="890" y1="305" x2="950" y2="305" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="914" y="296" width="13" height="16" fill="#FFFFFF" opacity="0.9"/>
<text x="920" y="308" font-size="10" text-anchor="middle" fill="#5B6678">x*</text>
<line x1="270" y1="305" x2="950" y2="305" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="765" y1="360" x2="765" y2="400" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="736" y="371" width="58" height="16" fill="#FFFFFF" opacity="0.9"/>
<text x="765" y="383" font-size="10" text-anchor="middle" fill="#5B6678">residuals</text>
<line x1="868" y1="400" x2="951" y2="360" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1180" y1="262" x2="1309" y2="214" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1180" y1="289" x2="1230" y2="282" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1180" y1="316" x2="1230" y2="322" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1180" y1="344" x2="1300" y2="384" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1161" y1="360" x2="1339" y2="462" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1395" y1="370" x2="1395" y2="560" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6,4"/>
<line x1="1230" y1="635" x2="1200" y2="640" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="957" y1="640" x2="797" y2="360" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6,4"/>
<rect x="848" y="491" width="58" height="16" fill="#FFFFFF" opacity="0.9"/>
<text x="877" y="503" font-size="10" text-anchor="middle" fill="#5B6678">re-weight</text>
<line x1="943" y1="640" x2="812" y2="500" stroke="#5B6678" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6,4"/>
<rect x="839" y="561" width="77" height="16" fill="#FFFFFF" opacity="0.9"/>
<text x="877" y="573" font-size="10" text-anchor="middle" fill="#5B6678">re-calibrate</text>
<text x="38" y="38" font-size="18" text-anchor="start" fill="#18202C" font-weight="bold">The Omni Gap Formula — x* = Π_F [ Σ_k w_k · μ_k(x | E) ], I = x* ± q₁₋α, tag = FT(F, I, τ)</text>
<text x="38" y="63" font-size="11" text-anchor="start" fill="#5B6678">One run of DETECT → PROCESS → RESPOND on one empty cell. Every path is tagged; nothing leaves blank. Code: formulas/omni_gap.py</text>
<rect x="40" y="110" width="230" height="60" rx="8" fill="#DDF0F3" stroke="#1F7A8C" stroke-width="2"/>
<text x="155" y="136" font-size="12" text-anchor="middle" fill="#18202C" font-weight="bold">DETECT</text>
<text x="155" y="152" font-size="12" text-anchor="middle" fill="#18202C" font-weight="bold">the gap x and what surrounds it</text>
<rect x="40" y="190" width="230" height="60" rx="8" fill="#DDF0F3" stroke="#1F7A8C" stroke-width="1"/>
<text x="155" y="202" font-size="11" text-anchor="middle" fill="#18202C">E — the measured values in the same</text>
<text x="155" y="217" font-size="11" text-anchor="middle" fill="#18202C">record</text>
<text x="155" y="231" font-size="11" text-anchor="middle" fill="#18202C">only measured values; never another</text>
<text x="155" y="245" font-size="11" text-anchor="middle" fill="#18202C">fill</text>
<rect x="40" y="270" width="230" height="70" rx="8" fill="#DDF0F3" stroke="#1F7A8C" stroke-width="1"/>
<text x="155" y="287" font-size="11" text-anchor="middle" fill="#18202C">F — the feasible set</text>
<text x="155" y="302" font-size="11" text-anchor="middle" fill="#18202C">bounds + identities the record must</text>
<text x="155" y="316" font-size="11" text-anchor="middle" fill="#18202C">obey</text>
<text x="155" y="330" font-size="11" text-anchor="middle" fill="#18202C">(revenue − cogs = gross)</text>
<rect x="40" y="360" width="230" height="60" rx="8" fill="#DDF0F3" stroke="#1F7A8C" stroke-width="1"/>
<text x="155" y="380" font-size="11" text-anchor="middle" fill="#18202C">τ — decision tolerance</text>
<text x="155" y="394" font-size="11" text-anchor="middle" fill="#18202C">the error size that would change a</text>
<text x="155" y="408" font-size="11" text-anchor="middle" fill="#18202C">decision</text>
<rect x="40" y="440" width="230" height="60" rx="8" fill="#DDF0F3" stroke="#1F7A8C" stroke-width="1" stroke-dasharray="6,4"/>
<text x="155" y="467" font-size="11" text-anchor="middle" fill="#18202C">Parallel system(s) + mapping</text>
<text x="155" y="481" font-size="11" text-anchor="middle" fill="#18202C">which variables correspond (optional)</text>
<text x="338" y="123" font-size="13" text-anchor="start" fill="#18202C" font-weight="bold">PROCESS — four evidence channels, one layer each</text>
<rect x="330" y="150" width="250" height="80" rx="8" fill="#FBEEDF" stroke="#C26A12" stroke-width="1"/>
<text x="455" y="172" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">P · Capsule prior</text>
<text x="455" y="187" font-size="11" text-anchor="middle" fill="#18202C">what this variable looks like across</text>
<text x="455" y="201" font-size="11" text-anchor="middle" fill="#18202C">every prior record</text>
<text x="455" y="215" font-size="11" text-anchor="middle" fill="#18202C">Layer I.G — all prior paths</text>
<rect x="330" y="250" width="250" height="80" rx="8" fill="#FBEEDF" stroke="#C26A12" stroke-width="1"/>
<text x="455" y="272" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">S · Process structure</text>
<text x="455" y="287" font-size="11" text-anchor="middle" fill="#18202C">the variable's measured relation to the</text>
<text x="455" y="301" font-size="11" text-anchor="middle" fill="#18202C">other values in this record (ridge)</text>
<text x="455" y="315" font-size="11" text-anchor="middle" fill="#18202C">Layer 0 / I.C</text>
<rect x="330" y="350" width="250" height="80" rx="8" fill="#FBEEDF" stroke="#C26A12" stroke-width="1"/>
<text x="455" y="372" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">R · Analogue</text>
<text x="455" y="387" font-size="11" text-anchor="middle" fill="#18202C">the nearest comparable records in the</text>
<text x="455" y="401" font-size="11" text-anchor="middle" fill="#18202C">same system (k-NN)</text>
<text x="455" y="415" font-size="11" text-anchor="middle" fill="#18202C">Layer I.G / II</text>
<rect x="330" y="450" width="250" height="100" rx="8" fill="#FBEEDF" stroke="#C26A12" stroke-width="1" stroke-dasharray="6,4"/>
<text x="455" y="468" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">C · Correspondence</text>
<text x="455" y="482" font-size="11" text-anchor="middle" fill="#18202C">the relation fitted in a PARALLEL system</text>
<text x="455" y="497" font-size="11" text-anchor="middle" fill="#18202C">on its own standardized coordinates,</text>
<text x="455" y="511" font-size="11" text-anchor="middle" fill="#18202C">applied here: the shape transfers, the</text>
<text x="455" y="525" font-size="11" text-anchor="middle" fill="#18202C">scale does not</text>
<text x="455" y="540" font-size="11" text-anchor="middle" fill="#18202C">Layer II, Axiom 10</text>
<rect x="640" y="250" width="250" height="110" rx="8" fill="#FBEEDF" stroke="#C26A12" stroke-width="2"/>
<text x="765" y="273" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">w · weights</text>
<text x="765" y="287" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">learned by hiding values that ARE known</text>
<text x="765" y="302" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">and measuring which channel recovers</text>
<text x="765" y="316" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">them (non-negative least squares)</text>
<text x="765" y="330" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">Capsule loop — every failed path</text>
<text x="765" y="345" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">integrated</text>
<rect x="950" y="250" width="230" height="110" rx="8" fill="#FBEEDF" stroke="#C26A12" stroke-width="2"/>
<text x="1065" y="287" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">Π_F · condition on F</text>
<text x="1065" y="302" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">Gaussian conditioning on the</text>
<text x="1065" y="316" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">identities; when one value survives</text>
<text x="1065" y="330" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">the cell is FORCED (exact)</text>
<rect x="640" y="400" width="250" height="100" rx="8" fill="#FBEEDF" stroke="#C26A12" stroke-width="1"/>
<text x="765" y="425" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">q₁₋α · calibrated width</text>
<text x="765" y="440" font-size="11" text-anchor="middle" fill="#18202C">the (1−α) quantile of the errors on</text>
<text x="765" y="454" font-size="11" text-anchor="middle" fill="#18202C">those hidden known values</text>
<text x="765" y="468" font-size="11" text-anchor="middle" fill="#18202C">(split-conformal): the stated miss rate</text>
<text x="765" y="482" font-size="11" text-anchor="middle" fill="#18202C">IS the measured miss rate</text>
<text x="1238" y="123" font-size="13" text-anchor="start" fill="#18202C" font-weight="bold">RESPOND — a value for every open cell, with</text>
<text x="1238" y="140" font-size="13" text-anchor="start" fill="#18202C" font-weight="bold">its tag</text>
<rect x="1230" y="150" width="330" height="64" rx="8" fill="#EBF2DD" stroke="#5F7F22" stroke-width="1"/>
<text x="1238" y="179" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">forced-fill</text>
<text x="1238" y="193" font-size="11" text-anchor="start" fill="#18202C">identities leave one value: exact</text>
<rect x="1230" y="228" width="330" height="64" rx="8" fill="#EBF2DD" stroke="#5F7F22" stroke-width="1"/>
<text x="1238" y="257" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">estimate</text>
<text x="1238" y="271" font-size="11" text-anchor="start" fill="#18202C">range within τ; act on it</text>
<rect x="1230" y="306" width="330" height="64" rx="8" fill="#EBF2DD" stroke="#5F7F22" stroke-width="1"/>
<text x="1238" y="328" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">estimate/wide</text>
<text x="1238" y="342" font-size="11" text-anchor="start" fill="#18202C">range wider than τ; act with care; next measurement</text>
<text x="1238" y="356" font-size="11" text-anchor="start" fill="#18202C">named</text>
<rect x="1230" y="384" width="330" height="64" rx="8" fill="#FFF2CC" stroke="#B8860B" stroke-width="1"/>
<text x="1238" y="406" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">assumption/prior-only</text>
<text x="1238" y="420" font-size="11" text-anchor="start" fill="#18202C">nothing beats the base rate; the value IS the base</text>
<text x="1238" y="434" font-size="11" text-anchor="start" fill="#18202C">rate, tagged</text>
<rect x="1230" y="462" width="330" height="64" rx="8" fill="#F8DCDC" stroke="#A33A3A" stroke-width="1"/>
<text x="1238" y="484" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">conflict</text>
<text x="1238" y="498" font-size="11" text-anchor="start" fill="#18202C">the record contradicts itself — no value; measure</text>
<text x="1238" y="512" font-size="11" text-anchor="start" fill="#18202C">this record</text>
<rect x="1230" y="560" width="330" height="90" rx="8" fill="#E3E8F1" stroke="#2B3A55" stroke-width="2"/>
<text x="1395" y="587" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">Every output carries</text>
<text x="1395" y="602" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">value · 90% range · tag · falsifier (observation +</text>
<text x="1395" y="616" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">threshold) · the one measurement that would narrow it</text>
<text x="1395" y="630" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">most</text>
<rect x="330" y="640" width="400" height="80" rx="8" fill="#F8DCDC" stroke="#A33A3A" stroke-width="2"/>
<text x="530" y="670" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">TERMINATE (audit correction F-066)</text>
<text x="530" y="684" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">never emit a value without its tag; never use a fill as an input</text>
<text x="530" y="698" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">to another fill</text>
<rect x="760" y="640" width="440" height="80" rx="8" fill="#E3E8F1" stroke="#2B3A55" stroke-width="2"/>
<text x="980" y="670" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">LEARN · restart at a higher baseline (MMA step 12)</text>
<text x="980" y="684" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">every measurement later revealed joins the calibration set; sealed</text>
<text x="980" y="698" font-size="11" text-anchor="middle" fill="#18202C" font-weight="bold">predictions are scored and the learned widening is applied once n ≥ 9</text>
<rect x="40" y="760" width="1140" height="90" rx="8" fill="#F5F6F8" stroke="#9AA5B5" stroke-width="1"/>
<text x="48" y="795" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">Measured on real tables (formulas/benchmark.py)</text>
<text x="48" y="809" font-size="11" text-anchor="start" fill="#18202C">Auto-MPG error 0.426 vs best standard method 0.448 · penguins 0.561 vs 0.584 · P&amp;L 0.234 vs 0.256</text>
<text x="48" y="823" font-size="11" text-anchor="start" fill="#18202C">90% ranges held the truth 91–93% of the time · Correspondence: mammal brain mass across 3 orders of magnitude 1.04 → 0.60; sign-reversed control: weight 0, 'not supported'</text>
<rect x="1230" y="700" width="330" height="150" rx="8" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/>
<text x="1238" y="743" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">What it does not do</text>
<text x="1238" y="757" font-size="11" text-anchor="start" fill="#18202C">produce a number from a canon layer (the audit found</text>
<text x="1238" y="772" font-size="11" text-anchor="start" fill="#18202C">zero such cases) · beat the best possible inference</text>
<text x="1238" y="786" font-size="11" text-anchor="start" fill="#18202C">from the same information · fill a boundary gap (t →</text>
<text x="1238" y="800" font-size="11" text-anchor="start" fill="#18202C">0) where no prior, structure, analogue or trend</text>
<text x="1238" y="815" font-size="11" text-anchor="start" fill="#18202C">exists</text>
<text x="38" y="909" font-size="9" text-anchor="start" fill="#5B6678">Derivation, not canon. Source: GFunnel Methodology (Omni Process) v5.1–v5.4, Cameron Garlick / GFunnel, github.com/GFunnel-Tech/methodology, CC BY 4.0. The formula is an adaptation; not endorsed by the author.</text>
</svg>