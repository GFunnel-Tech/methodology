<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5B6678"/></marker></defs>
<text x="38" y="38" font-size="18" text-anchor="start" fill="#18202C" font-weight="bold">The anatomy of one tagged estimate — what every number the system emits looks like, and what each tag permits</text>
<rect x="40" y="80" width="720" height="190" rx="8" fill="#E3E8F1" stroke="#2B3A55" stroke-width="1"/>
<text x="48" y="132" font-size="12" text-anchor="start" fill="#18202C" font-weight="bold">monthly_revenue_usd: 22 000 USD/month [tag: estimate]</text>
<text x="48" y="148" font-size="12" text-anchor="start" fill="#18202C"></text>
<text x="48" y="164" font-size="12" text-anchor="start" fill="#18202C">range : 17 500 – 27 500 (90%)</text>
<text x="48" y="179" font-size="12" text-anchor="start" fill="#18202C">method : prior (base rate for firms of this size) · structure (clients × average contract) · analogue (3</text>
<text x="48" y="195" font-size="12" text-anchor="start" fill="#18202C">comparable firms) · trend (two earlier readings)</text>
<text x="48" y="210" font-size="12" text-anchor="start" fill="#18202C">falsifier : refuted if the measured value falls outside 17 500 – 27 500</text>
<text x="48" y="226" font-size="12" text-anchor="start" fill="#18202C">next : measure the client count — expected to shrink this range ~40%</text>
<rect x="40" y="300" width="230" height="85" rx="8" fill="#EBF2DD" stroke="#5F7F22" stroke-width="1"/>
<text x="48" y="318" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">value</text>
<text x="48" y="332" font-size="11" text-anchor="start" fill="#18202C">the best number the evidence</text>
<text x="48" y="346" font-size="11" text-anchor="start" fill="#18202C">supports. Always present unless the</text>
<text x="48" y="361" font-size="11" text-anchor="start" fill="#18202C">tag is conflict (or held-open after</text>
<text x="48" y="375" font-size="11" text-anchor="start" fill="#18202C">the four-part test).</text>
<rect x="285" y="300" width="230" height="85" rx="8" fill="#FFF2CC" stroke="#B8860B" stroke-width="1"/>
<text x="293" y="332" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">tag</text>
<text x="293" y="346" font-size="11" text-anchor="start" fill="#18202C">how the value was made. One of six;</text>
<text x="293" y="361" font-size="11" text-anchor="start" fill="#18202C">see right.</text>
<rect x="530" y="300" width="230" height="85" rx="8" fill="#EBF2DD" stroke="#5F7F22" stroke-width="1"/>
<text x="538" y="318" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">range + coverage</text>
<text x="538" y="332" font-size="11" text-anchor="start" fill="#18202C">calibrated where there is history</text>
<text x="538" y="346" font-size="11" text-anchor="start" fill="#18202C">(the stated miss rate is the measured</text>
<text x="538" y="361" font-size="11" text-anchor="start" fill="#18202C">miss rate); judged where there is</text>
<text x="538" y="375" font-size="11" text-anchor="start" fill="#18202C">not, and it says which.</text>
<rect x="40" y="400" width="230" height="85" rx="8" fill="#FBEEDF" stroke="#C26A12" stroke-width="1"/>
<text x="48" y="425" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">method</text>
<text x="48" y="439" font-size="11" text-anchor="start" fill="#18202C">which of the four channels fed it:</text>
<text x="48" y="454" font-size="11" text-anchor="start" fill="#18202C">prior · structure · analogue · trend</text>
<text x="48" y="468" font-size="11" text-anchor="start" fill="#18202C">(Forecasting Algorithm steps 3–6).</text>
<rect x="285" y="400" width="230" height="85" rx="8" fill="#F8DCDC" stroke="#A33A3A" stroke-width="1"/>
<text x="293" y="418" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">falsifier</text>
<text x="293" y="432" font-size="11" text-anchor="start" fill="#18202C">the observation and threshold that</text>
<text x="293" y="446" font-size="11" text-anchor="start" fill="#18202C">would prove it wrong (Layer ◇ step</text>
<text x="293" y="461" font-size="11" text-anchor="start" fill="#18202C">2). Without it, it is a belief, not</text>
<text x="293" y="475" font-size="11" text-anchor="start" fill="#18202C">an estimate.</text>
<rect x="530" y="400" width="230" height="85" rx="8" fill="#E3E8F1" stroke="#2B3A55" stroke-width="1"/>
<text x="538" y="425" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">next</text>
<text x="538" y="439" font-size="11" text-anchor="start" fill="#18202C">the one measurement that would narrow</text>
<text x="538" y="454" font-size="11" text-anchor="start" fill="#18202C">it most (the Anti-Operation's</text>
<text x="538" y="468" font-size="11" text-anchor="start" fill="#18202C">conjugate gap).</text>
<text x="828" y="93" font-size="13" text-anchor="start" fill="#18202C" font-weight="bold">The six tags and what each one permits</text>
<rect x="820" y="115" width="130" height="78" rx="8" fill="#EBF2DD" stroke="#5F7F22" stroke-width="2"/>
<text x="885" y="158" font-size="12" text-anchor="middle" fill="#18202C" font-weight="bold">measured</text>
<rect x="960" y="115" width="360" height="78" rx="8" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/>
<text x="968" y="158" font-size="11" text-anchor="start" fill="#18202C">taken from a source, with uncertainty</text>
<rect x="1330" y="115" width="230" height="78" rx="8" fill="#F5F6F8" stroke="#9AA5B5" stroke-width="1"/>
<text x="1338" y="158" font-size="10" text-anchor="start" fill="#18202C">must carry: cite source and date</text>
<rect x="820" y="207" width="130" height="78" rx="8" fill="#EBF2DD" stroke="#5F7F22" stroke-width="2"/>
<text x="885" y="250" font-size="12" text-anchor="middle" fill="#18202C" font-weight="bold">forced</text>
<rect x="960" y="207" width="360" height="78" rx="8" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/>
<text x="968" y="243" font-size="11" text-anchor="start" fill="#18202C">follows by necessity from measured values (one candidate</text>
<text x="968" y="257" font-size="11" text-anchor="start" fill="#18202C">survives)</text>
<rect x="1330" y="207" width="230" height="78" rx="8" fill="#F5F6F8" stroke="#9AA5B5" stroke-width="1"/>
<text x="1338" y="250" font-size="10" text-anchor="start" fill="#18202C">must carry: state the identities used</text>
<rect x="820" y="299" width="130" height="78" rx="8" fill="#EBF2DD" stroke="#5F7F22" stroke-width="2"/>
<text x="885" y="342" font-size="12" text-anchor="middle" fill="#18202C" font-weight="bold">estimate</text>
<rect x="960" y="299" width="360" height="78" rx="8" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/>
<text x="968" y="335" font-size="11" text-anchor="start" fill="#18202C">calculated from stated evidence (prior · structure ·</text>
<text x="968" y="349" font-size="11" text-anchor="start" fill="#18202C">analogue · trend), range calibrated where possible</text>
<rect x="1330" y="299" width="230" height="78" rx="8" fill="#F5F6F8" stroke="#9AA5B5" stroke-width="1"/>
<text x="1338" y="335" font-size="10" text-anchor="start" fill="#18202C">must carry: value + range + method +</text>
<text x="1338" y="348" font-size="10" text-anchor="start" fill="#18202C">falsifier</text>
<rect x="820" y="391" width="130" height="78" rx="8" fill="#FFF2CC" stroke="#B8860B" stroke-width="2"/>
<text x="885" y="434" font-size="12" text-anchor="middle" fill="#18202C" font-weight="bold">assumption</text>
<rect x="960" y="391" width="360" height="78" rx="8" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/>
<text x="968" y="420" font-size="11" text-anchor="start" fill="#18202C">a value from judgement alone. PERMITTED — an unstated</text>
<text x="968" y="434" font-size="11" text-anchor="start" fill="#18202C">assumption is worse. Scored separately so its reliability</text>
<text x="968" y="448" font-size="11" text-anchor="start" fill="#18202C">is learned</text>
<rect x="1330" y="391" width="230" height="78" rx="8" fill="#F5F6F8" stroke="#9AA5B5" stroke-width="1"/>
<text x="1338" y="427" font-size="10" text-anchor="start" fill="#18202C">must carry: value + range + falsifier +</text>
<text x="1338" y="440" font-size="10" text-anchor="start" fill="#18202C">the word 'assumption'</text>
<rect x="820" y="483" width="130" height="78" rx="8" fill="#F8DCDC" stroke="#A33A3A" stroke-width="2"/>
<text x="885" y="526" font-size="12" text-anchor="middle" fill="#18202C" font-weight="bold">held-open</text>
<rect x="960" y="483" width="360" height="78" rx="8" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/>
<text x="968" y="512" font-size="11" text-anchor="start" fill="#18202C">NO value — allowed only when no prior, no structure, no</text>
<text x="968" y="526" font-size="11" text-anchor="start" fill="#18202C">analogue and no trend exists. 'I don't know' is not a</text>
<text x="968" y="540" font-size="11" text-anchor="start" fill="#18202C">reason; anything that has happened before has a prior</text>
<rect x="1330" y="483" width="230" height="78" rx="8" fill="#F5F6F8" stroke="#9AA5B5" stroke-width="1"/>
<text x="1338" y="519" font-size="10" text-anchor="start" fill="#18202C">must carry: the reason, and what would</text>
<text x="1338" y="532" font-size="10" text-anchor="start" fill="#18202C">narrow it</text>
<rect x="820" y="575" width="130" height="78" rx="8" fill="#F8DCDC" stroke="#A33A3A" stroke-width="2"/>
<text x="885" y="618" font-size="12" text-anchor="middle" fill="#18202C" font-weight="bold">conflict</text>
<rect x="960" y="575" width="360" height="78" rx="8" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/>
<text x="968" y="611" font-size="11" text-anchor="start" fill="#18202C">the evidence disagrees with itself beyond its stated</text>
<text x="968" y="625" font-size="11" text-anchor="start" fill="#18202C">errors</text>
<rect x="1330" y="575" width="230" height="78" rx="8" fill="#F5F6F8" stroke="#9AA5B5" stroke-width="1"/>
<text x="1338" y="611" font-size="10" text-anchor="start" fill="#18202C">must carry: the witnesses, and which one</text>
<text x="1338" y="624" font-size="10" text-anchor="start" fill="#18202C">restores agreement if removed</text>
<rect x="40" y="520" width="720" height="110" rx="8" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/>
<text x="48" y="565" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">Before 2026-10-20 the protocol had three statuses (measured · derived · held open) and gave the AI no permitted form</text>
<text x="48" y="579" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">for a calculated estimate. Rule 5 read as 'refuse'; a user's forecast test showed the cost (missed numbers, 3–4×</text>
<text x="48" y="593" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">slower). The Estimate Protocol (substrate/2026-10-20-estimate-protocol.md) added the tags and the four-part test.</text>
<rect x="40" y="650" width="720" height="100" rx="8" fill="#FFF2CC" stroke="#B8860B" stroke-width="1"/>
<text x="48" y="690" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">The four-part test for omitting a value: 1 no prior · 2 no structure · 3 no analogue · 4 no trend. All four absent →</text>
<text x="48" y="704" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">held-open. Any one present → a value can be calculated and must be. The Big Bang's first moment passes. Next</text>
<text x="48" y="718" font-size="11" text-anchor="start" fill="#18202C" font-weight="bold">quarter's revenue does not.</text>
<text x="38" y="859" font-size="9" text-anchor="start" fill="#5B6678">Derivation, not canon. Source: GFunnel Methodology (Omni Process) v5.1–v5.4, Cameron Garlick / GFunnel, github.com/GFunnel-Tech/methodology, CC BY 4.0. The formula is an adaptation; not endorsed by the author.</text>
</svg>